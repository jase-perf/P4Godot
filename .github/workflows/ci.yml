name: CI

# Every push and pull request runs the self-tests and the live tests (against
# a throwaway Perforce server) on Windows and Linux.
# Pushing a tag like v0.15.0 runs them too, then publishes a GitHub release
# with the p4godot-v0.15.0.zip the README tells people to download.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7-stable
  P4_RELEASE: r25.2

jobs:
  selftests:
    # The checks that need no Perforce server. Windows is where the plugin has
    # been verified by hand; Linux is where nothing else tests it.
    name: Self-tests (${{ matrix.os }}, Godot 4.7)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: Windows, runner: windows-latest }
          - { os: Linux, runner: ubuntu-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-godot-p4
        id: tools
      - name: Run the self-tests against a clean install
        run: VERBOSE=1 sh tools/run-selftests.sh "${{ steps.tools.outputs.godot }}"

  live-tests:
    # The checks that need a real server, against a throwaway p4d started on
    # the runner (tools/p4-test-server.sh), as an ordinary user.
    name: Live tests (${{ matrix.os }}, Godot 4.7)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: Windows, runner: windows-latest }
          - { os: Linux, runner: ubuntu-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-godot-p4
        id: tools
      - name: Cache the pinned p4d
        uses: actions/cache@v4
        with:
          path: .cache/p4d
          key: p4d-${{ runner.os }}-${{ hashFiles('tools/p4-test-server.sh') }}
      - name: Run the live tests
        run: sh tools/run-live-tests.sh "${{ steps.tools.outputs.godot }}"

  release:
    name: Publish the release zip
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [selftests, live-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches plugin.cfg
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^version=\"${version}\"" addons/p4godot/plugin.cfg; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin.cfg:"
            grep "^version=" addons/p4godot/plugin.cfg
            exit 1
          fi

      - name: Build the zip
        # .gitattributes strips everything but addons/, so the zip unpacks to
        # an addons folder that drops straight into a project.
        run: |
          git archive --format=zip -o "p4godot-${GITHUB_REF_NAME}.zip" HEAD
          unzip -l "p4godot-${GITHUB_REF_NAME}.zip"

      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## / { on = ($2 == v); next } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no '## ${version}' section."
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "p4godot-${GITHUB_REF_NAME}.zip" \
            --verify-tag \
            --title "P4Godot ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
