[plugin]

name="P4Godot"
description="Perforce (P4) integration for the Godot editor: automatic checkout on edit and save, a pending-changelists dock, FileSystem-dock P4 actions and status tooltips, and a p4merge-style side-by-side diff viewer. Runs the p4 command-line client on a background thread, with guided connection setup on first run and per-project settings that never touch machine-wide p4 config."
author="Jase Lindgren"
version="0.14.0"
script="p4godot.gd"
