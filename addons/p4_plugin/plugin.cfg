[plugin]

name="P4 Perforce Integration (Prototype)"
description="Experimental Perforce integration for Godot 4.7+. Offers to check out files (to the default changelist) the moment you modify them, checks out edited files automatically right before saves, rescues failed read-only saves with a check-out-and-retry dialog, and works in allwrite workspaces. Includes manual checkout/revert/sync/reload actions in a movable P4 dock. p4 commands run on a background thread so a slow server never stalls the editor."
author="Jase Lindgren"
version="0.5.0"
script="p4_plugin.gd"
