[plugin]

name="P4 Perforce Integration (Prototype)"
description="Experimental Perforce integration for Godot 4.7+. Offers to check out files (to the default changelist) the moment you modify them, checks out edited files automatically right before saves, rescues failed read-only saves with a check-out-and-retry dialog, and works in allwrite workspaces. The P4 dock shows your pending changelists and the files opened in each, with a right-click menu to open/revert/sync files, move them between changelists, and create/edit/submit/delete changelists, plus Reconcile and Revert Unchanged buttons. The activity log (every p4 command and its output) lives in its own window. p4 commands run on a background thread so a slow server never stalls the editor."
author="Jase Lindgren"
version="0.8.0"
script="p4_plugin.gd"
