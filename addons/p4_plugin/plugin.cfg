[plugin]

name="P4 Perforce Integration (Prototype)"
description="Experimental Perforce integration for Godot 4.7+. Offers to check out files (to the default changelist) the moment you modify them, checks out edited files automatically right before saves, rescues failed read-only saves with a check-out-and-retry dialog, and works in allwrite workspaces. The P4 dock shows your pending changelists and the files opened in each, with a right-click menu to open/diff/revert/sync files, move them between changelists, and create/edit/submit/delete changelists, plus Reconcile and Revert Unchanged buttons. The FileSystem dock gets native P4 hooks too: right-click Perforce actions (checkout, add, sync, diff, revert, status), hover tooltips showing each file's Perforce status, and delete/move/rename tracking that records deletions and history-preserving moves in your changelist. Diffs render in their own colored window and the activity log (every p4 command and its output) in another. p4 commands run on a background thread so a slow server never stalls the editor."
author="Jase Lindgren"
version="0.10.0"
script="p4_plugin.gd"
