[plugin]

name="P4 Perforce Integration"
description="Perforce (Helix Core) integration for Godot 4.7+. Offers to check out files the moment you modify them - into the pending changelist you pick right in the prompt - checks out edited files automatically right before saves, rescues failed read-only saves with a check-out-and-retry dialog (skipped when the save carried no actual changes), and works in allwrite workspaces. Guided connection setup on first run: the plugin detects what's missing (server, login, workspace), suggests your existing workspaces by root match, and stores the choice per-project - no machine-wide p4 config touched; an expired ticket mid-session pops a re-login prompt. The P4 dock shows your pending changelists and the files opened in each, with drag-and-drop between changelists and a right-click menu to open/diff/revert/sync files, move them between changelists, and create/edit/submit/delete changelists, plus Reconcile and Revert Unchanged. The FileSystem dock gets native P4 hooks too: right-click Perforce actions (checkout, add, sync, diff, revert, status), hover tooltips showing each file's Perforce status, and delete/move/rename tracking that records deletions and history-preserving moves in your changelist. Diffs open in a p4merge-style side-by-side window (depot revision vs workspace, aligned rows, intraline change highlighting, line-ending tolerant) and the activity log (every p4 command and its output) in another. p4 commands run on a background thread so a slow server never stalls the editor."
author="Jase Lindgren"
version="0.13.0"
script="p4_plugin.gd"
